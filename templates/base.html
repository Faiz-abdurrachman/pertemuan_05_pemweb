<!DOCTYPE html>
<html lang="id">
<head>

    <title>{% block title %}Mini Portal{% endblock %} - Praktikum Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

        <a href="{{ url_for('home') }}" class="brand">MiniPortal</a>

</html>
